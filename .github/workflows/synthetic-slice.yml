name: Synthetic BI vertical slice
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify exact dependency resolution
        run: |
          python -m pip freeze --exclude-editable > /tmp/installed.txt
          grep -v '^#' requirements.lock | sed '/^$/d' > /tmp/locked.txt
          diff -u /tmp/locked.txt /tmp/installed.txt
      - name: Fixture and publication unit tests
        run: python -m unittest discover -s tests -v
      - name: Positive end-to-end pipeline
        run: python src/run.py
      - name: Preserve positive test evidence and dependency resolution
        run: |
          mkdir -p output/evidence
          cp output/report.json output/evidence/success-report.json
          cp output/dbt-target/run_results.json output/evidence/positive-run-results.json
          python -m pip freeze --exclude-editable > output/evidence/requirements-resolved.txt
      - name: Verify reproducibility
        run: |
          cp output/report.json /tmp/success-report.json
          python src/run.py
          cmp output/report.json /tmp/success-report.json
      - name: Reject orphan line
        run: |
          set +e
          python src/run.py --inject orphan
          code=$?
          set -e
          test "$code" -eq 42
          test ! -f output/report.json
          cp output/dbt-target/run_results.json output/evidence/orphan-run-results.json
      - name: Reject duplicate order key
        run: |
          set +e
          python src/run.py --inject duplicate-order
          code=$?
          set -e
          test "$code" -eq 42
          test ! -f output/report.json
          cp output/dbt-target/run_results.json output/evidence/duplicate-run-results.json
      - name: Reject invalid financial subtotal
        run: |
          set +e
          python src/run.py --inject wrong-subtotal
          code=$?
          set -e
          test "$code" -eq 42
          test ! -f output/report.json
          cp output/dbt-target/run_results.json output/evidence/subtotal-run-results.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-slice-evidence
          path: output/evidence/
          if-no-files-found: warn
          retention-days: 7
