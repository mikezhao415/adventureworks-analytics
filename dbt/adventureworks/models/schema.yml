models:
- name: stg_sales_order_header
  description: Selected source columns, all source rows and statuses; no business
    filtering. Source timestamps have no timezone.
  config:
    meta:
      grain_keys: &id001
      - sales_order_id
  data_tests:
  - grain:
      arguments:
        keys: *id001
  columns:
