    data_type: integer
    description: Source Sales.SalesOrderHeader.SalesOrderID; required.
    data_tests:
    - not_null
  - name: order_date
    data_type: timestamp
    description: Source Sales.SalesOrderHeader.OrderDate; required.
  - name: due_date
    data_type: timestamp
    description: Source Sales.SalesOrderHeader.DueDate; required.
  - name: ship_date
    data_type: timestamp
    description: Source Sales.SalesOrderHeader.ShipDate; nullable.
  - name: status
    data_type: integer
    description: Source Sales.SalesOrderHeader.Status; required.
  - name: online_order_flag
    data_type: boolean
    description: Source Sales.SalesOrderHeader.OnlineOrderFlag; required.
  - name: customer_id
    data_type: integer
    description: Source Sales.SalesOrderHeader.CustomerID; required.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_customer')
          field: customer_id
  - name: territory_id
    data_type: integer
    description: Source Sales.SalesOrderHeader.TerritoryID; nullable.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_sales_territory')
          field: territory_id
  - name: sub_total
    data_type: decimal(19,4)
    description: Source Sales.SalesOrderHeader.SubTotal; required.
  - name: tax_amt
    data_type: decimal(19,4)
    description: Source Sales.SalesOrderHeader.TaxAmt; required.
